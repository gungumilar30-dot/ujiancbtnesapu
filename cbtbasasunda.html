<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="https://i.imgur.com/EEyhouN.png" />
    <title>Ujian SDN 1 PURWADADI</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
        
        /* Pengaturan Print Sertifikat */
        @media print {
            body { background-color: white !important; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            .no-print { display: none !important; }
            #print-area { box-shadow: none !important; border: 2px solid #e2e8f0 !important; margin: 0 auto !important; padding: 40px !important; width: 100% !important; page-break-inside: avoid; }
            @page { margin: 1.5cm; }
        }
        
        /* Scrollbar kustom untuk grid nomor soal */
        .custom-scrollbar::-webkit-scrollbar { height: 6px; width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
    <!-- Kontainer Aplikasi Utama -->
    <div id="app" class="max-w-4xl mx-auto p-4 md:p-8"></div>

    <script>
        // --- KONFIGURASI URL BACKEND ---
        // GANTI INI DENGAN URL DEPLOYMENT BARU SETELAH ANDA MENGUPDATE CODE.GS!
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwWViexh9gq8BmioUPsPWhZ-y7Ed4SPGXjOtNA7YPzhzhVin4GswBuTIwLoovCdwfjA/exec"; 

        // --- MANAJEMEN STATE GLOBAL ---
        const AppState = {
            view: 'login', // login, instruction, exam, result
            user: null,
            questions: [], 
            currentIdx: 0,
            answers: {},
            timer: 3600,
            error: null,
            isConfirmingFinish: false,
            scoreSent: false,
            isSending: false,
            sendError: null
        };

        const SecureKeys = {}; 
        let timerInterval = null;
        const appElement = document.getElementById('app');

        // --- ICONS (SVG) ---
        const Icons = {
            'shield-check': `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10zM9 12l2 2 4-4"/></svg>`,
            'arrow-right': `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>`,
            'check-circle': `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" /><polyline points="22 4 12 14.01 9 11.01" /></svg>`,
            'clock': `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" /><polyline points="12 6 12 12 16 14" /></svg>`,
            'chevron-left': `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6" /></svg>`,
            'chevron-right': `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6" /></svg>`,
            'send': `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13" /><polyline points="22 2 15 22 11 13 2 9 22 2" /></svg>`,
            'check': `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12" /></svg>`,
            'alert-circle': `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" /><line x1="12" y1="8" x2="12" y2="12" /><line x1="12" y1="16" x2="12.01" y2="16" /></svg>`,
            'alert-triangle': `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z" /><line x1="12" y1="9" x2="12" y2="13" /><line x1="12" y1="17" x2="12.01" y2="17" /></svg>`,
            'printer': `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9" /><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2" /><rect x="6" y="14" width="12" height="8" /></svg>`,
            'upload-cloud': `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 16 12 12 8 16" /><line x1="12" y1="12" x2="12" y2="21" /><path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3" /><polyline points="16 16 12 12 8 16" /></svg>`,
            'grid': `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>`
        };

        function getIcon(name, size = 20, className = "") {
            if (!Icons[name]) return '';
            return Icons[name].replace('<svg ', `<svg width="${size}" height="${size}" class="${className}" `);
        }

        function formatTime(s) {
            const min = Math.floor(s / 60);
            const sec = s % 60;
            return `${min}:${sec.toString().padStart(2, '0')}`;
        }

        function getEmbedUrl(url) {
            if (!url) return "";
            let videoId = "";
            if (url.includes("youtube.com/watch?v=")) videoId = url.split("v=")[1].split("&")[0];
            else if (url.includes("youtu.be/")) videoId = url.split("youtu.be/")[1].split("?")[0];
            else if (url.includes("youtube.com/shorts/")) videoId = url.split("shorts/")[1].split("?")[0];
            else if (url.includes("embed/")) return url;
            return videoId ? `https://www.youtube.com/embed/${videoId}` : url;
        }

        // --- SISTEM AUTO-SAVE LOKAL & CLOUD (CROSS-DEVICE) ---
        function getSessionData() {
            return {
                userId: AppState.user.id,
                answers: AppState.answers,
                timer: AppState.timer,
                currentIdx: AppState.currentIdx,
                view: AppState.view,
                questionsOrder: AppState.questions.map(q => q.id)
            };
        }

        function saveSession() {
            if (!AppState.user) return;
            const data = getSessionData();
            localStorage.setItem(`cbt_session_${AppState.user.id}`, JSON.stringify(data));
        }

        async function syncSessionToServer() {
            if (!AppState.user || AppState.view === 'result') return;
            const data = getSessionData();
            try {
                fetch(SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'syncSession', userId: AppState.user.id, sessionData: data })
                });
            } catch(e) {}
        }

        function loadSession(userId) {
            const saved = localStorage.getItem(`cbt_session_${userId}`);
            return saved ? JSON.parse(saved) : null;
        }

        function clearSession() {
            if (AppState.user) {
                localStorage.removeItem(`cbt_session_${AppState.user.id}`);
            }
        }

        // --- PENGENDALI LOGIKA (LOGIC HANDLERS) ---
        window.handleLogin = async function(event) {
            event.preventDefault();
            const formData = new FormData(event.target);
            const userId = formData.get('userId');
            const password = formData.get('password');
            
            AppState.error = null;
            renderLoader('Mengecek Akun & Sinkronisasi Data...');

            try {
                const response = await fetch(`${SCRIPT_URL}?action=login&id=${userId}&pass=${password}`);
                const result = await response.json();
                
                if (result.success) {
                    if (result.user.status === 'completed') {
                        AppState.user = {
                            ...result.user,
                            score: result.user.score !== undefined && result.user.score !== "" ? result.user.score : "Data Kosong"
                        };
                        AppState.scoreSent = true;
                        AppState.view = 'result';
                        updateView();
                    } else {
                        AppState.user = result.user;
                        let sessionToLoad = result.savedSession; 
                        const localSaved = loadSession(userId); 

                        if (localSaved && sessionToLoad) {
                            if (localSaved.timer <= sessionToLoad.timer) {
                                sessionToLoad = localSaved;
                            }
                        } else if (!sessionToLoad && localSaved) {
                            sessionToLoad = localSaved;
                        }

                        if (sessionToLoad && (sessionToLoad.view === 'exam' || sessionToLoad.view === 'instruction')) {
                            AppState.answers = sessionToLoad.answers || {};
                            AppState.timer = sessionToLoad.timer || 3600;
                            AppState.currentIdx = sessionToLoad.currentIdx || 0;
                            AppState.view = sessionToLoad.view;
                        }
                        await fetchQuestions(sessionToLoad);
                    }
                } else {
                    AppState.error = result.message;
                    AppState.view = 'login';
                    updateView();
                }
            } catch (err) {
                AppState.error = "Gagal login. Cek koneksi internet Anda.";
                AppState.view = 'login';
                updateView();
            }
        };

        async function fetchQuestions(savedSession = null) {
            renderLoader('Memuat Soal...');
            try {
                const response = await fetch(`${SCRIPT_URL}?action=getQuestions`);
                const result = await response.json();
                
                if (result.success && result.data) {
                    let parsed = [];
                    result.data.forEach((q) => {
                        try {
                            let formattedAnswer = {};
                            if (q.type === 'MATRIX' && q.answer && q.answer.toString().includes(':')) {
                                formattedAnswer = Object.fromEntries(
                                    q.answer.toString().split('|').filter(s => s.includes(':')).map(s => s.trim().split(':'))
                                );
                            } else if (q.type === 'CHECKBOX' && q.answer) {
                                formattedAnswer = q.answer.toString().split('|').map(s => s.trim());
                            } else {
                                formattedAnswer = (q.answer || "").toString().trim();
                            }

                            SecureKeys[q.id] = formattedAnswer;

                            if (q.text) {
                                parsed.push({
                                    id: q.id,
                                    text: q.text,
                                    type: q.type,
                                    options: q.options ? q.options.toString().split('|').map(s => s.trim()) : [],
                                    rows: q.rows ? q.rows.toString().split('|').map(s => s.trim()) : [],
                                    cols: q.cols ? q.cols.toString().split('|').map(s => s.trim()) : [],
                                    category: q.category ? q.category.toString().trim() : "Tanpa Kategori",
                                    mediaUrl: q.mediaType === 'video' ? getEmbedUrl(q.mediaUrl) : q.mediaUrl,
                                    mediaType: q.mediaType
                                });
                            }
                        } catch (e) {}
                    });

                    if (parsed.length === 0) {
                        AppState.error = "Data soal kosong. Periksa Spreadsheet Anda.";
                        AppState.view = 'login';
                        updateView();
                        return;
                    }

                    if (savedSession && savedSession.questionsOrder) {
                        const ordered = savedSession.questionsOrder.map(id => parsed.find(p => p.id === id)).filter(Boolean);
                        if (ordered.length > 0) {
                            AppState.questions = ordered;
                            if (AppState.view !== 'exam') AppState.view = 'instruction';
                            updateView();
                            if (AppState.view === 'exam') startTimer();
                            return;
                        }
                    }

                    const targetCount = 50;
                    let selected = [];

                    if (parsed.length <= targetCount) {
                        selected = parsed.sort(() => 0.5 - Math.random());
                    } else {
                        const byCategory = {};
                        parsed.forEach(q => {
                            if (!byCategory[q.category]) byCategory[q.category] = [];
                            byCategory[q.category].push(q);
                        });

                        Object.keys(byCategory).forEach(cat => {
                            const catArr = byCategory[cat].sort(() => 0.5 - Math.random());
                            const prop = catArr.length / parsed.length;
                            const pickAmt = Math.min(Math.round(prop * targetCount), catArr.length);
                            selected.push(...catArr.slice(0, pickAmt));
                        });

                        if (selected.length < targetCount) {
                            const unpicked = parsed.filter(q => !selected.includes(q)).sort(() => 0.5 - Math.random());
                            selected.push(...unpicked.slice(0, targetCount - selected.length));
                        } else if (selected.length > targetCount) {
                            selected = selected.slice(0, targetCount);
                        }
                        selected = selected.sort(() => 0.5 - Math.random());
                    }

                    AppState.questions = selected;
                    if(AppState.view !== 'exam') AppState.view = 'instruction';
                    saveSession();
                    updateView();

                } else {
                    AppState.error = "Gagal mengambil soal.";
                    AppState.view = 'login';
                    updateView();
                }
            } catch (err) {
                AppState.error = "Kesalahan memuat soal.";
                AppState.view = 'login';
                updateView();
            }
        }

        window.startExam = function() {
            AppState.view = 'exam';
            saveSession();
            syncSessionToServer(); 
            updateView();
            startTimer();
        };

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                AppState.timer--;
                
                const timerEl = document.getElementById('timer-display');
                if (timerEl) {
                    timerEl.innerHTML = `${getIcon('clock', 22)} ${formatTime(AppState.timer)}`;
                    if (AppState.timer <= 300 && !timerEl.classList.contains('text-red-500')) {
                        timerEl.className = "flex items-center gap-2 font-mono font-black text-2xl px-5 py-2 rounded-2xl text-red-500 bg-red-50 animate-pulse";
                    }
                }

                if (AppState.timer % 5 === 0) saveSession(); 
                if (AppState.timer % 30 === 0) syncSessionToServer();

                if (AppState.timer <= 0) {
                    clearInterval(timerInterval);
                    window.calculateScoreAndFinish();
                }
            }, 1000);
        }

        window.selectPG = function(qId, optStr) {
            const opt = decodeURIComponent(optStr);
            AppState.answers[qId] = opt;
            saveSession();
            updateView();
        };

        window.toggleCheckbox = function(qId, optStr) {
            const opt = decodeURIComponent(optStr);
            if (!AppState.answers[qId]) AppState.answers[qId] = [];
            const idx = AppState.answers[qId].indexOf(opt);
            if (idx > -1) AppState.answers[qId].splice(idx, 1);
            else AppState.answers[qId].push(opt);
            saveSession();
            updateView();
        };

        window.selectMatrix = function(qId, rIdx, colStr) {
            const col = decodeURIComponent(colStr);
            if (!AppState.answers[qId]) AppState.answers[qId] = {};
            AppState.answers[qId][rIdx] = col;
            saveSession();
            updateView();
        };

        // NAVIGASI SOAL VIA GRID
        window.goToQuestion = function(idx) {
            AppState.currentIdx = idx;
            AppState.isConfirmingFinish = false;
            saveSession();
            syncSessionToServer();
            updateView();
        };

        window.prevQuestion = function() {
            if (AppState.currentIdx > 0) {
                AppState.currentIdx--;
                AppState.isConfirmingFinish = false;
                saveSession();
                syncSessionToServer();
                updateView();
            }
        };

        window.nextQuestion = function() {
            if (AppState.currentIdx < AppState.questions.length - 1) {
                AppState.currentIdx++;
                saveSession();
                syncSessionToServer(); 
                updateView();
            }
        };

        window.confirmFinish = function() {
            AppState.isConfirmingFinish = true;
            updateView();
        };

        window.cancelFinish = function() {
            AppState.isConfirmingFinish = false;
            updateView();
        };

        window.calculateScoreAndFinish = function() {
            renderLoader('Menghitung Nilai...');
            if (timerInterval) clearInterval(timerInterval);
            
            setTimeout(() => {
                let score = 0;
                const totalSoal = AppState.questions.length;
                
                if (totalSoal > 0) {
                    const bobotPerSoal = 100 / totalSoal;
                    AppState.questions.forEach(q => {
                        const userAns = AppState.answers[q.id];
                        const correctAns = SecureKeys[q.id];
                        if (!userAns || !correctAns) return;

                        if (q.type === 'PG' && userAns === correctAns) {
                            score += bobotPerSoal;
                        } else if (q.type === 'CHECKBOX') {
                            const isCorrect = Array.isArray(userAns) && userAns.length === correctAns.length && userAns.every(v => correctAns.includes(v));
                            if (isCorrect) score += bobotPerSoal;
                        } else if (q.type === 'MATRIX') {
                            let correctCount = 0;
                            const keys = Object.keys(correctAns);
                            if (keys.length > 0) {
                                keys.forEach(idx => {
                                    if (userAns[idx] === correctAns[idx]) correctCount++;
                                });
                                if (correctCount === q.rows.length) score += bobotPerSoal;
                            }
                        }
                    });
                }

                AppState.user.score = Math.round(score);
                AppState.view = 'result';
                clearSession(); 
                updateView();
            }, 800);
        };

        window.handleKirimNilai = async function() {
            AppState.isSending = true;
            AppState.sendError = null;
            updateView();

            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'submit', userId: AppState.user.id, score: AppState.user.score, details: AppState.answers })
                });
                
                const result = await response.json();
                if (result.success) AppState.scoreSent = true;
                else AppState.sendError = "Server menolak data. Silakan coba lagi.";
            } catch (err) {
                AppState.sendError = "Gagal mengirim ke database. Periksa koneksi internet Anda.";
            } finally {
                AppState.isSending = false;
                updateView();
            }
        };

        // --- SISTEM RENDERING (UI) ---
        function renderLoader(message = 'Memproses...') {
            appElement.innerHTML = `
                <div class="flex flex-col items-center justify-center h-[80vh] bg-transparent text-center p-4">
                    <div class="w-16 h-16 border-4 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
                    <p class="mt-6 text-slate-500 font-bold tracking-widest animate-pulse uppercase">${message}</p>
                </div>
            `;
        }

        function updateView() {
            if (AppState.view === 'login') renderLogin();
            else if (AppState.view === 'instruction') renderInstruction();
            else if (AppState.view === 'exam') renderExam();
            else if (AppState.view === 'result') renderResult();
        }

        function renderLogin() {
            let errorHtml = AppState.error ? `
                <div class="p-4 bg-red-50 border border-red-100 rounded-2xl flex items-start gap-3">
                    ${getIcon('alert-circle', 20, 'text-red-500 mt-0.5')}
                    <p class="text-red-600 text-sm font-bold leading-relaxed">${AppState.error}</p>
                </div>` : '';

            appElement.innerHTML = `
                <div class="max-w-md mx-auto mt-20 bg-white p-10 rounded-[2.5rem] shadow-2xl border border-slate-100">
                    <img src="https://i.imgur.com/EEyhouN.png" alt="Logo SDN" class="h-24 mx-auto mb-6 object-contain" />
                    <h2 class="text-2xl md:text-3xl font-extrabold text-center text-slate-800 mb-2 leading-tight">Ujian Online<br/>SDN 1 PURWADADI</h2>
                    <p class="text-center text-slate-500 mb-8 font-medium italic">Silakan masuk dengan akun Anda</p>
                    <form onsubmit="window.handleLogin(event)" class="space-y-5">
                        <div>
                            <label class="text-xs font-black text-slate-400 uppercase tracking-widest ml-1">ID Peserta / NISN</label>
                            <input name="userId" required class="w-full p-4 rounded-2xl border-2 border-slate-100 mt-1 focus:ring-4 focus:ring-blue-50 focus:border-blue-500 outline-none transition-all font-bold" placeholder="Masukkan ID" />
                        </div>
                        <div>
                            <label class="text-xs font-black text-slate-400 uppercase tracking-widest ml-1">Password</label>
                            <input type="password" name="password" required class="w-full p-4 rounded-2xl border-2 border-slate-100 mt-1 focus:ring-4 focus:ring-blue-50 focus:border-blue-500 outline-none transition-all font-bold" placeholder="••••••••" />
                        </div>
                        ${errorHtml}
                        <button type="submit" class="w-full bg-blue-600 text-white p-4 rounded-2xl font-black text-lg flex items-center justify-center gap-3 hover:bg-blue-700 shadow-xl shadow-blue-100 transition-all active:scale-[0.98]">
                            MASUK SEKARANG ${getIcon('arrow-right', 20)}
                        </button>
                    </form>
                </div>
            `;
        }

        function renderInstruction() {
            appElement.innerHTML = `
                <div class="bg-white p-10 rounded-[3rem] shadow-xl border border-slate-100">
                    <h2 class="text-3xl font-black text-slate-800 mb-6 border-b pb-4 uppercase italic">Konfirmasi Data</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-10">
                        <div class="p-6 bg-slate-50 rounded-3xl border border-slate-100">
                            <p class="text-xs text-slate-400 font-black uppercase mb-1 tracking-widest">Nama Peserta</p>
                            <p class="text-xl font-black text-slate-700">${AppState.user.name}</p>
                            <p class="text-sm text-slate-500 mt-1 font-bold italic">${AppState.user.school}</p>
                        </div>
                        <div class="p-6 bg-blue-600 rounded-3xl shadow-lg shadow-blue-100 flex items-center justify-center">
                            <div class="text-center text-white">
                                <p class="text-xs font-black uppercase mb-1 opacity-80">Durasi Ujian</p>
                                <p class="text-2xl font-black italic">60 MENIT</p>
                            </div>
                        </div>
                    </div>
                    <button onclick="window.startExam()" class="w-full bg-slate-900 text-white py-5 rounded-3xl font-black text-xl hover:bg-slate-800 shadow-xl transition-all active:scale-[0.98]">
                        MULAI MENGERJAKAN
                    </button>
                </div>
            `;
        }

        function renderExam() {
            const q = AppState.questions[AppState.currentIdx];
            
            // --- PEMBUATAN GRID NAVIGASI SOAL ---
            let navGridHtml = `<div class="bg-white p-6 rounded-[2rem] border border-slate-100 shadow-sm mb-6">
                <div class="flex items-center gap-2 mb-4">
                    <div class="bg-blue-100 text-blue-600 p-2 rounded-xl">${getIcon('grid', 20)}</div>
                    <h3 class="font-black text-slate-700 text-lg">Peta Soal</h3>
                </div>
                <div class="grid grid-cols-5 sm:grid-cols-10 gap-2 sm:gap-3 max-h-48 overflow-y-auto custom-scrollbar pr-2">`;
            
            AppState.questions.forEach((question, index) => {
                let isAnswered = false;
                const ans = AppState.answers[question.id];
                
                // Cek apakah soal ini sudah dijawab
                if (ans !== undefined && ans !== null) {
                    if (question.type === 'PG' && ans !== "") {
                        isAnswered = true;
                    } else if (question.type === 'CHECKBOX' && Array.isArray(ans) && ans.length > 0) {
                        isAnswered = true;
                    } else if (question.type === 'MATRIX' && Object.keys(ans).length === question.rows.length) {
                        isAnswered = true; // Untuk Matriks, dianggap dijawab jika SEMUA baris diisi
                    }
                }

                const isCurrent = index === AppState.currentIdx;
                let btnClass = `w-full aspect-square flex items-center justify-center rounded-xl font-black text-sm transition-all border-2 `;
                
                if (isAnswered) {
                    btnClass += `bg-green-500 border-green-600 text-white shadow-sm hover:bg-green-600 `;
                } else {
                    btnClass += `bg-red-500 border-red-600 text-white hover:bg-red-600 shadow-sm `;
                }

                // Highlight khusus untuk soal yang sedang dibuka
                if (isCurrent) {
                    btnClass += `ring-4 ring-blue-200 scale-110 z-10 shadow-md `;
                }

                navGridHtml += `<button onclick="window.goToQuestion(${index})" class="${btnClass}">${index + 1}</button>`;
            });

            navGridHtml += `</div>
                <div class="flex flex-wrap gap-4 mt-5 pt-4 border-t border-slate-100 text-xs font-bold text-slate-500 uppercase tracking-widest">
                    <div class="flex items-center gap-2"><div class="w-4 h-4 bg-green-500 rounded flex-shrink-0 border border-green-600"></div> Sudah Dijawab</div>
                    <div class="flex items-center gap-2"><div class="w-4 h-4 bg-red-500 border border-red-600 rounded flex-shrink-0"></div> Belum Dijawab</div>
                </div>
            </div>`;
            // --- AKHIR PEMBUATAN GRID ---

            let mediaHtml = '';
            if (q.mediaUrl) {
                 mediaHtml = `
                    <div class="mb-10 rounded-[2rem] overflow-hidden border-4 border-slate-50 bg-slate-50 shadow-inner">
                        ${q.mediaType === 'image' ? 
                            `<img src="${q.mediaUrl}" class="w-full max-h-[450px] object-contain mx-auto" alt="Media Soal" onerror="this.onerror=null;this.src='https://via.placeholder.com/800x400?text=Gambar+Tidak+Dapat+Dimuat';"/>` 
                            : 
                            `<div class="aspect-video"><iframe class="w-full h-full" src="${q.mediaUrl}" frameborder="0" allowfullscreen></iframe></div>`
                        }
                    </div>`;
            }

            let optionsHtml = '';
            if (q.type === 'PG') {
                optionsHtml = q.options.map((opt, i) => {
                    const isSelected = AppState.answers[q.id] === opt;
                    const encodedOpt = encodeURIComponent(opt);
                    return `
                        <button onclick="window.selectPG('${q.id}', '${encodedOpt}')" class="w-full text-left p-5 rounded-2xl border-2 transition-all flex items-center gap-5 ${isSelected ? 'border-blue-600 bg-blue-50' : 'border-slate-50 hover:border-blue-100 bg-white shadow-sm'}">
                            <span class="w-12 h-12 flex items-center justify-center rounded-xl font-black text-lg ${isSelected ? 'bg-blue-600 text-white' : 'bg-slate-100 text-slate-500'}">${String.fromCharCode(65 + i)}</span>
                            <span class="font-bold text-slate-700 text-lg">${opt}</span>
                        </button>
                    `;
                }).join('');
            } else if (q.type === 'CHECKBOX') {
                optionsHtml = q.options.map((opt, i) => {
                    const isSelected = (AppState.answers[q.id] || []).includes(opt);
                    const encodedOpt = encodeURIComponent(opt);
                    return `
                        <button onclick="window.toggleCheckbox('${q.id}', '${encodedOpt}')" class="w-full text-left p-5 rounded-2xl border-2 transition-all flex items-center gap-5 ${isSelected ? 'border-blue-600 bg-blue-50' : 'border-slate-50 hover:border-blue-100 bg-white shadow-sm'}">
                            <div class="w-8 h-8 rounded-xl border-2 flex items-center justify-center transition-all ${isSelected ? 'bg-blue-600 border-blue-600 text-white' : 'border-slate-200'}">
                                ${isSelected ? getIcon('check', 18) : ''}
                            </div>
                            <span class="font-bold text-slate-700 text-lg">${opt}</span>
                        </button>
                    `;
                }).join('');
            } else if (q.type === 'MATRIX') {
                const rowsHtml = q.rows.map((row, rIdx) => {
                    const colsHtml = q.cols.map(col => {
                        const isChecked = (AppState.answers[q.id] || {})[rIdx] === col;
                        const encodedCol = encodeURIComponent(col);
                        return `<td class="p-5 text-center"><input type="radio" name="matrix-${q.id}-${rIdx}" ${isChecked ? 'checked' : ''} onchange="window.selectMatrix('${q.id}', ${rIdx}, '${encodedCol}')" class="w-7 h-7 accent-blue-600 cursor-pointer" /></td>`;
                    }).join('');
                    return `<tr class="border-b last:border-0 hover:bg-slate-50 transition-colors"><td class="p-6 font-bold text-slate-700">${row}</td>${colsHtml}</tr>`;
                }).join('');
                
                const theadCols = q.cols.map(c => `<th class="p-3 border text-center font-black uppercase text-xs tracking-widest">${c}</th>`).join('');
                optionsHtml = `<div class="overflow-x-auto rounded-3xl border border-slate-100 shadow-sm"><table class="w-full border-collapse"><thead class="bg-slate-800 text-white"><tr><th class="p-5 text-left font-black uppercase text-xs tracking-widest">Pernyataan</th>${theadCols}</tr></thead><tbody>${rowsHtml}</tbody></table></div>`;
            }

            let finishButtonHtml = AppState.isConfirmingFinish ? 
                `<div class="flex items-center gap-2 animate-fade-in">
                    <button onclick="window.cancelFinish()" class="px-6 py-4 bg-slate-200 text-slate-700 rounded-3xl font-bold uppercase text-sm hover:bg-slate-300">Batal</button>
                    <button onclick="window.calculateScoreAndFinish()" class="px-10 py-4 bg-green-600 text-white rounded-3xl font-black text-lg shadow-xl shadow-green-100 hover:bg-green-700 flex items-center gap-3 uppercase">YAKIN SELESAI ${getIcon('check-circle', 22)}</button>
                </div>` : 
                `<button onclick="window.confirmFinish()" class="px-14 py-4 bg-blue-600 text-white rounded-3xl font-black text-lg shadow-xl shadow-blue-100 hover:bg-blue-700 flex items-center gap-3 uppercase">Selesai Ujian ${getIcon('send', 22)}</button>`;

            appElement.innerHTML = `
                <div class="space-y-6">
                    <div class="flex justify-between items-center bg-white/90 backdrop-blur-md p-5 rounded-3xl border border-slate-100 shadow-sm sticky top-4 z-20">
                        <span class="bg-blue-600 text-white px-6 py-2 rounded-2xl font-black text-sm uppercase">Soal ${AppState.currentIdx + 1} / ${AppState.questions.length}</span>
                        <div id="timer-display" class="flex items-center gap-2 font-mono font-black text-2xl px-5 py-2 rounded-2xl ${AppState.timer < 300 ? 'text-red-500 bg-red-50 animate-pulse' : 'text-slate-700 bg-slate-50'}">
                            ${getIcon('clock', 22)} ${formatTime(AppState.timer)}
                        </div>
                    </div>

                    ${navGridHtml}

                    <div class="bg-white p-8 md:p-12 rounded-[3.5rem] border border-slate-100 shadow-2xl">
                        ${mediaHtml}
                        <p class="text-2xl font-extrabold text-slate-800 mb-10 leading-relaxed tracking-tight">${q.text}</p>
                        <div class="space-y-4">${optionsHtml}</div>
                    </div>
                    
                    <div class="flex justify-between items-center pt-4 pb-16">
                        <button ${AppState.currentIdx === 0 ? 'disabled' : ''} onclick="window.prevQuestion()" class="px-10 py-4 rounded-3xl font-black bg-white border-2 border-slate-100 shadow-sm disabled:opacity-30 flex items-center gap-2 hover:bg-slate-50 transition-all uppercase text-sm">
                            ${getIcon('chevron-left', 18)} Sebelumnya
                        </button>
                        ${AppState.currentIdx === AppState.questions.length - 1 ? finishButtonHtml : 
                            `<button onclick="window.nextQuestion()" class="px-10 py-4 bg-blue-600 text-white rounded-3xl font-black shadow-xl shadow-blue-100 hover:bg-blue-700 flex items-center gap-2 uppercase text-sm">Selanjutnya ${getIcon('chevron-right', 18)}</button>`
                        }
                    </div>
                </div>
            `;
        }

        function renderResult() {
            const today = new Date();
            const dateString = today.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
            
            let statusNotif = '';
            if (AppState.sendError) statusNotif = `<div class="p-4 bg-red-50 border-2 border-red-200 rounded-3xl flex items-center gap-3 justify-center text-red-600 font-bold animate-pulse">${getIcon('alert-triangle')} ${AppState.sendError}</div>`;
            if (AppState.scoreSent) statusNotif = `<div class="p-4 bg-green-50 border-2 border-green-200 rounded-3xl flex items-center gap-3 justify-center text-green-700 font-bold">${getIcon('check-circle')} Nilai berhasil tersimpan di server!</div>`;

            let actionBtn = !AppState.scoreSent ? 
                `<button onclick="window.handleKirimNilai()" ${AppState.isSending ? 'disabled' : ''} class="w-full py-5 bg-blue-600 text-white rounded-3xl font-black shadow-xl shadow-blue-200 hover:bg-blue-700 transition-all disabled:opacity-50 flex items-center justify-center gap-2 uppercase text-sm">${getIcon('upload-cloud')} ${AppState.isSending ? 'Mengirim Data...' : 'Kirim Nilai'}</button>` :
                `<button onclick="window.location.reload()" class="w-full py-5 bg-slate-900 text-white rounded-3xl font-black shadow-xl hover:bg-slate-800 transition-all uppercase text-sm">Ke Menu Utama</button>`;

            appElement.innerHTML = `
                <div class="max-w-2xl mx-auto mt-10">
                    <div id="print-area" class="bg-white p-12 rounded-[4rem] shadow-2xl border-4 border-slate-50 text-center relative overflow-hidden mb-8">
                        <div class="absolute top-0 left-0 w-full h-4 bg-blue-600"></div>
                        <img src="https://i.imgur.com/EEyhouN.png" alt="Logo SD" class="h-28 mx-auto mb-6 object-contain" />
                        <h2 class="text-4xl font-black text-slate-800 mb-2 uppercase tracking-widest">HASIL UJIAN</h2>
                        <p class="text-slate-400 font-bold tracking-widest uppercase text-sm mb-2">Sertifikat Digital</p>
                        <p class="text-blue-700 font-extrabold tracking-widest uppercase text-md mb-10">Mata Pelajaran: Pendidikan Pancasila</p>
                        
                        <div class="mb-10">
                            <p class="text-2xl font-black text-slate-800 uppercase">${AppState.user.name}</p>
                            <p class="text-lg text-slate-500 font-semibold">${AppState.user.school}</p>
                        </div>
                        <div class="bg-slate-900 p-10 rounded-[3rem] shadow-2xl relative max-w-sm mx-auto">
                            <div class="absolute -top-3 left-1/2 -translate-x-1/2 bg-blue-600 text-white text-[10px] font-black px-4 py-1 rounded-full tracking-widest uppercase">Skor Final</div>
                            <p class="font-black text-white italic ${String(AppState.user.score).length > 3 ? 'text-5xl py-4' : 'text-8xl'}">${AppState.user.score}</p>
                        </div>
                        <div class="mt-16 flex justify-end text-right w-full pr-4">
                            <div class="w-56 text-center">
                                <p class="text-slate-600 font-medium mb-24">Purwadadi, ${dateString}</p>
                                <p class="text-slate-800 font-bold uppercase underline decoration-2 underline-offset-4">TIM UJIAN</p>
                            </div>
                        </div>
                    </div>
                    <div class="no-print space-y-4">
                        ${statusNotif}
                        <div class="grid grid-cols-2 gap-4">
                            <button onclick="window.print()" class="w-full py-5 bg-white border-4 border-slate-100 text-slate-700 rounded-3xl font-black hover:bg-slate-50 transition-all flex items-center justify-center gap-2 uppercase text-sm">${getIcon('printer')} Print Sertifikat</button>
                            ${actionBtn}
                        </div>
                    </div>
                </div>
            `;
        }

        document.addEventListener('DOMContentLoaded', updateView);
    </script>
</body>
</html>
